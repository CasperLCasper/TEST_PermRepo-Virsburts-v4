name: PermRepo backup audit tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backup-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backup audit tests
        run: npm test
        timeout-minutes: 5
      # Pārbauda, ka frontend (JSX) kompilējas — testi paši to neaptver.
      - name: Build frontend
        run: npm run build
        timeout-minutes: 5

  # T-03: atkarību ievainojamību pārbaude ir atsevišķa un NEBLOĶĒ parasto CI
  # (ārēja servisa nepieejamība nedrīkst apturēt izstrādi).
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: npm audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high
        timeout-minutes: 5
